# Tema aplikasi Firaza: monokrom. Terang = latar putih, teks hitam; gelap = latar hitam, teks putih.
# Kartu vendor rekomendasi menonjol lewat kontras terbalik (lihat app_css di app/streamlit_app.py).
# Font: Plus Jakarta Sans (SIL Open Font License 1.1), dimuat dari Google Fonts.
# Varian terang/gelap mengikuti pengaturan sistem pengguna (bisa diganti di menu ⋮ > Settings).

[theme]
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#111111"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F3F3"
textColor = "#111111"
linkColor = "#111111"
borderColor = "#DEDEDE"
dataframeHeaderBackgroundColor = "#F3F3F3"
# Kotak st.success (saran waktu rawan) netral, bukan hijau.
greenColor = "#111111"
greenBackgroundColor = "#F0F0F0"
greenTextColor = "#111111"

[theme.dark]
primaryColor = "#F2F2F2"
backgroundColor = "#000000"
secondaryBackgroundColor = "#161616"
textColor = "#F2F2F2"
linkColor = "#F2F2F2"
borderColor = "#2E2E2E"
dataframeHeaderBackgroundColor = "#161616"
greenColor = "#F2F2F2"
greenBackgroundColor = "#1A1A1A"
greenTextColor = "#F2F2F2"
