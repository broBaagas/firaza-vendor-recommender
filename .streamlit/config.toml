# Tema aplikasi Firaza: hijau zamrud (sajadah, Lebaran) sebagai warna utama, emas antik (pita
# hampers) hanya untuk penanda vendor rekomendasi (lihat CSS di app/streamlit_app.py).
# Font: Plus Jakarta Sans (SIL Open Font License 1.1), dimuat dari Google Fonts.
# Varian terang dan gelap mengikuti pengaturan sistem pengguna (bisa diganti di menu ⋮ > Settings).

[theme]
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#0F5C4D"
backgroundColor = "#F6F8F7"
secondaryBackgroundColor = "#E8EFEC"
textColor = "#1D2B28"
linkColor = "#0F5C4D"
borderColor = "#CFDAD6"
dataframeHeaderBackgroundColor = "#E8EFEC"
greenColor = "#0F5C4D"
greenBackgroundColor = "#DCEBE5"
greenTextColor = "#0B4A3E"
yellowColor = "#B8862B"
yellowBackgroundColor = "#F5ECD9"
yellowTextColor = "#6E4F14"

[theme.dark]
primaryColor = "#1F8A70"
backgroundColor = "#0F1A18"
secondaryBackgroundColor = "#18302B"
textColor = "#E4ECE9"
linkColor = "#6FD1B8"
borderColor = "#2A433D"
dataframeHeaderBackgroundColor = "#18302B"
greenColor = "#3FB59A"
greenBackgroundColor = "#173A31"
greenTextColor = "#9FE3CF"
yellowColor = "#D9A94A"
yellowBackgroundColor = "#3A2E15"
yellowTextColor = "#F0D49A"
